name: One-off check (comment email test from a real browser)
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - shell: python
        run: |
          import asyncio
          from playwright.async_api import async_playwright
          JS = """async () => {
            const r = await fetch("https://formsubmit.co/ajax/shoroogmi1@gmail.com", {method:"POST",
              headers:{"Content-Type":"application/json",Accept:"application/json"},
              body: JSON.stringify({_subject:"💬 تعليق جديد: (وما تلك بيمينك يا موسى) — تجربة", _template:"box", _captcha:"false",
                "المقال":"(وما تلك بيمينك يا موسى)", "الاسم":"تجربة من Claude",
                "التعليق":"رسالة تجريبية لاختبار إشعار التعليقات، لم يُنشر أي تعليق في الموقع.",
                "رابط التعليق (للرد)":"https://shoroogmi.com/blog/articles/wa-ma-tilka-biyaminik.html#comments-title"})});
            return r.status + " " + (await r.text()).slice(0,300);
          }"""
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page(user_agent="Mozilla/5.0 (iPad; CPU OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1")
                  await pg.goto("https://shoroogmi.com/blog/articles/wa-ma-tilka-biyaminik.html")
                  print("RESULT:", await pg.evaluate(JS))
                  await b.close()
          asyncio.run(main())
