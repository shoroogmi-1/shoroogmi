name: Generate site HTML

on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'content/**'
      - 'tools/**'
      - '.github/workflows/generate-site.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-site
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install the voice tool
        run: pip install edge-tts==7.2.8
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Record new or edited articles in Hamed's voice, ten at a time, saving after each batch
      - name: Record article audio
        run: |
          for i in $(seq 1 30); do
            out=$(python3 tools/make_audio.py --max 10) || { echo "$out"; exit 1; }
            echo "$out"
            git add assets/audio
            git diff --cached --quiet && break
            git commit -m "Record article audio"
            git pull --rebase origin main && git push origin HEAD:main
          done
      - name: Generate HTML
        run: python3 build.py
      - name: Commit generated HTML
        run: |
          git add '*.html' 'blog/articles/*.html' 'en/blog/articles/*.html' assets/search-ar.json assets/search-en.json sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "No generated HTML changes."
          else
            git commit -m "Generate HTML pages from article content"
            git pull --rebase origin main && git push origin main
          fi
