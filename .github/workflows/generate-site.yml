name: Generate site HTML

on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'content/**'
      - '.github/workflows/generate-site.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate HTML
        run: python3 build.py
      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' 'blog/articles/*.html' 'en/blog/articles/*.html'
          if git diff --cached --quiet; then
            echo "No generated HTML changes."
          else
            git commit -m "Generate HTML pages from article content"
            git push origin main
          fi
