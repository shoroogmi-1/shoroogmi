name: Generate site HTML

on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'content/**'
      - 'tools/**'
      - '.github/workflows/generate-site.yml'
  workflow_dispatch:
  # كل يوم ٦:١٧ صباحًا بتوقيت السعودية: تحديث «اختيارات القرّاء» من عدّاد القراءات والإعجابات
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: generate-site
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # أحدث نسخة دائمًا: خدمة الصوت ترفض النسخ القديمة (هذا ما أوقف تسجيل المقالات الجديدة)
      - name: Install the voice tool
        run: pip install --upgrade edge-tts
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      # Record new or edited articles in Hamed's voice, ten at a time, saving after each batch
      # إن تعذّر التسجيل مؤقتًا لا يتوقف بناء الموقع، ويُعاد التسجيل في التشغيل التالي
      - name: Record article audio
        continue-on-error: true
        run: |
          for i in $(seq 1 30); do
            out=$(python3 tools/make_audio.py --max 10) || { echo "$out"; exit 1; }
            echo "$out"
            git add assets/audio
            git diff --cached --quiet && break
            git commit -m "Record article audio"
            git pull --rebase origin main && git push origin HEAD:main
          done
      - name: Update readers' picks
        continue-on-error: true
        run: python3 tools/popular.py
      - name: Generate HTML
        run: python3 build.py
      - name: Commit generated HTML
        run: |
          git add '*.html' 'blog/articles/*.html' 'en/blog/articles/*.html' assets/search-ar.json assets/search-en.json sitemap.xml robots.txt content/popular.json
          if git diff --cached --quiet; then
            echo "No generated HTML changes."
          else
            git commit -m "Generate HTML pages from article content"
            git pull --rebase origin main && git push origin main
          fi
      # إرسال المقالات الجديدة أو المعدّلة فورًا إلى Bing وغيره (IndexNow)، بعد أن صارت صفحاتها منشورة
      - name: Notify search engines
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          sleep 90
          BEFORE="${{ github.event.before }}"
          if git cat-file -e "$BEFORE" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- content/)
          else
            CHANGED=$(git show --name-only --format= "${{ github.sha }}" -- content/)
          fi
          python3 tools/indexnow.py $CHANGED
