name: Generate site HTML

on:
  push:
    branches: [main]
    paths:
      - 'build.py'
      - 'content/**'
      - 'tools/**'
      - '.github/workflows/generate-site.yml'
  workflow_dispatch:
  # كل يوم ٦:١٧ صباحًا بتوقيت السعودية: تحديث «اختيارات القرّاء» من عدّاد القراءات والإعجابات
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

concurrency:
  group: generate-site
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out site
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # أحدث نسخة دائمًا: خدمة الصوت ترفض النسخ القديمة (هذا ما أوقف تسجيل المقالات الجديدة)
      - name: Install the voice tool
        run: pip install --upgrade edge-tts pyyaml
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Update readers' picks
        continue-on-error: true
        run: python3 tools/popular.py
      # ١) ننشر الصفحات فورًا (المقال يظهر خلال دقيقة تقريبًا) — بأحدث محتوى ولو حُفظ مقال آخر أثناء الانتظار
      - name: Publish pages now
        run: |
          git pull --rebase --autostash origin main
          python3 build.py
          git add '*.html' 'blog/articles/*.html' 'en/blog/articles/*.html' assets/search-ar.json assets/search-en.json sitemap.xml robots.txt content/popular.json .pages.yml
          if git diff --cached --quiet; then
            echo "No generated HTML changes."
          else
            git commit -m "Generate HTML pages from article content"
            git pull --rebase --autostash origin main && git push origin HEAD:main
          fi
      # ٢) ثم نسجّل بصوت حامد (يأخذ دقائق)، عشرة مقالات في كل دفعة
      # إن تعذّر التسجيل مؤقتًا لا يتوقف شيء، ويُعاد التسجيل في التشغيل التالي
      - name: Record article audio
        continue-on-error: true
        run: |
          for i in $(seq 1 30); do
            out=$(python3 tools/make_audio.py --max 10) || { echo "$out"; exit 1; }
            echo "$out"
            git add assets/audio
            git diff --cached --quiet && break
            git commit -m "Record article audio"
            git pull --rebase --autostash origin main && git push origin HEAD:main
          done
      # ٣) نعيد بناء الصفحات ليظهر مشغّل الصوت في المقالات التي سُجّلت
      - name: Add audio players to pages
        run: |
          git pull --rebase --autostash origin main
          python3 build.py
          git add '*.html' 'blog/articles/*.html' 'en/blog/articles/*.html' assets/search-ar.json assets/search-en.json sitemap.xml robots.txt .pages.yml
          if git diff --cached --quiet; then
            echo "No generated HTML changes."
          else
            git commit -m "Add audio players to article pages"
            git pull --rebase --autostash origin main && git push origin HEAD:main
          fi
      # ٤) إرسال المقال الجديد إلى القائمة البريدية (بعد أن صارت صفحته منشورة)
      - name: Email new articles to subscribers
        continue-on-error: true
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEWSLETTER_TOKEN: ${{ secrets.NEWSLETTER_TOKEN }}
        run: |
          sleep 45
          python3 tools/newsletter.py || true
          git add content/newsletter-sent.json
          if ! git diff --cached --quiet; then
            git commit -m "Newsletter: record sent articles"
            git pull --rebase --autostash origin main && git push origin HEAD:main
          fi
      # إرسال المقالات الجديدة أو المعدّلة فورًا إلى Bing وغيره (IndexNow)، بعد أن صارت صفحاتها منشورة
      - name: Notify search engines
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          sleep 60
          BEFORE="${{ github.event.before }}"
          if git cat-file -e "$BEFORE" 2>/dev/null; then
            CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- content/)
          else
            CHANGED=$(git show --name-only --format= "${{ github.sha }}" -- content/)
          fi
          python3 tools/indexnow.py $CHANGED
