name: One-off check (live comment notification)
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - shell: python
        run: |
          import asyncio, json
          from playwright.async_api import async_playwright
          async def main():
              async with async_playwright() as p:
                  b = await p.chromium.launch()
                  pg = await b.new_page(user_agent="Mozilla/5.0 (iPad; CPU OS 18_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1")
                  async def fake(route):
                      r = route.request
                      if r.method == "POST":
                          d = json.loads(r.post_data); d.update(id=999, created_at="2026-11-23T11:55:00Z", parent_id=None, is_author=False)
                          await route.fulfill(json=[d])
                      else:
                          await route.continue_()
                  await pg.route("**/rest/v1/comments*", fake)  # not saved on the site
                  await pg.goto("https://shoroogmi.com/blog/articles/nazariyyat-dharhum.html")
                  await pg.wait_for_selector(".comment-form", state="visible", timeout=20000)
                  await pg.fill(".comment-form input[name=name]", "تجربة ٣ من Claude")
                  await pg.fill(".comment-form textarea", "تجربة إشعار الساعة ٢:٥٥ من نموذج التعليق في الموقع (لم يُحفظ التعليق).")
                  async with pg.expect_response(lambda r: "formsubmit" in r.url, timeout=30000) as resp:
                      await pg.click(".comment-form button")
                  r = await resp.value
                  print("RESULT", r.status, await r.text())
                  await b.close()
          asyncio.run(main())
