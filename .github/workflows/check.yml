name: One-off check (latest comments + live script)
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - run: |
          K=sb_publishable_xfQjqLqa091AzMM30SRp6g_llc9fjPx
          echo "COMMENTS:"; curl -s "https://fownwnktsvpzfyyndgtt.supabase.co/rest/v1/comments?order=created_at.desc&limit=5&select=*" -H "apikey: $K" -H "Authorization: Bearer $K"; echo
          echo "LIVE:"; curl -s https://shoroogmi.com/blog/articles/wa-ma-tilka-biyaminik.html | grep -o 'class="comments"[^>]*>\|script.js?v=[a-z0-9]*'
          curl -s https://shoroogmi.com/assets/script.js | grep -c notifyWriter
