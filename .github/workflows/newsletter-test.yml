name: Newsletter test

# تجربة القائمة البريدية يدويًا: Actions ← Newsletter test ← Run workflow
# ترسل آخر مقال إلى بريد الكاتبة وحدها (لا إلى المشتركين) وتطبع عدد المشتركين.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - name: Send a test email to the writer only
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NEWSLETTER_TOKEN: ${{ secrets.NEWSLETTER_TOKEN }}
        run: python3 tools/newsletter.py --test
