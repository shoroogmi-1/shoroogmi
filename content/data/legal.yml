# سياسة الخصوصية وشروط الاستخدام. **كلمة** غامقة، و[نص](رابط) رابط.
updated:
  ar: ١٢ أكتوبر ٢٠٢٦
  en: October 12, 2026
privacy:
- title_ar: مقدمة
  title_en: Introduction
  paragraphs:
  - ar: موقع شخصي لا يتطلب حسابًا، ولا يبيع بياناتك ولا يشاركها.
    en: A personal website. It needs no account, and it never sells or shares your data.
- title_ar: ما الذي نجمعه؟
  title_en: What we collect
  paragraphs:
  - ar: '**عدّاد القراءة والزيارات والإعجابات:** أرقام فقط، لا يحفظ اسمك ولا بريدك.'
    en: '**Read, visit and like counters:** numbers only. They never keep your name or email.'
  - ar: '**التعليقات على المقالات:** الاسم الذي تكتبه ونص تعليقك، وتظهر للقرّاء.'
    en: '**Comments on articles:** the name you type and your comment, shown to readers.'
  - ar: '**رسائل برج المراقبة:** تصل إلى بريد الكاتبة، ولا تُنشر.'
    en: '**Control Tower messages:** they reach the writer''s inbox and are never published.'
  - ar: '**التقييم:** يصل إلى بريد الكاتبة، وقد يظهر في الصفحة الرئيسية بالاسم الذي كتبته.'
    en: '**Ratings:** they reach the writer''s inbox, and may appear on the home page with the name you gave.'
- title_ar: ما يُحفظ في جهازك
  title_en: What stays on your device
  paragraphs:
  - ar: 'تفضيلاتك فقط: الوضع الليلي، وما أعجبك وما أكملت قراءته، وتظليلاتك وملاحظاتك على المقالات (لا يراها أحد غيرك). لا ملفات ارتباط (Cookies)، ولا تتبّع إعلاني.'
    en: 'Only your preferences: dark mode, what you liked or finished reading, and your highlights and notes on articles (nobody else sees them). No cookies, no ad tracking.'
- title_ar: لماذا نجمعها؟
  title_en: Why
  paragraphs:
  - ar: للرد عليك، وعرض التعليقات، ومعرفة عدد القرّاء. لا إعلانات، ولا بيع.
    en: To reply to you, show comments, and know how many people read. No ads, no selling.
- title_ar: حقوقك
  title_en: Your rights
  paragraphs:
  - ar: 'اطلب حذف تعليقك أو رسالتك متى شئت: [shoroogmi1@gmail.com](mailto:shoroogmi1@gmail.com).'
    en: 'Ask for your comment or message to be deleted at any time: [shoroogmi1@gmail.com](mailto:shoroogmi1@gmail.com).'
- title_ar: التعديلات
  title_en: Changes
  paragraphs:
  - ar: قد تُحدَّث هذه السياسة، وتاريخ آخر تحديث في أعلى الصفحة.
    en: This policy may be updated; the date of the latest update is at the top of the page.
terms:
- title_ar: قبول الشروط
  title_en: Acceptance
  paragraphs:
  - ar: باستخدامك موقع shoroogmi.com فأنت توافق على هذه الشروط. إن لم توافق عليها فنرجو ألا تستخدم الموقع.
    en: By using shoroogmi.com you agree to these terms. If you do not agree, please do not use the site.
- title_ar: حقوق المحتوى ومشاركته
  title_en: Sharing the content
  paragraphs:
  - ar: '**المقالات والنصوص الدينية** (مثل «تأملات في القرآن والسنة» و«شعب العلاقة مع القرآن»): يمكن اقتباسها ونشرها دون ذكر اسم الكاتبة، ودون إذن مسبق.'
    en: '**Religious articles and texts** (such as “Reflections on the Quran & Sunnah” and “Branches of the Relationship with the Quran”): you may quote and publish them without the writer''s name and without prior permission.'
  - ar: '**المقالات الإعلامية، ومقالات الذكاء الاصطناعي، والموضوعات الثقافية:** يمكن مشاركتها ونسخها كاملة، بشرط ذكر اسم الكاتبة (شروق المحمادي) أو الإشارة إلى الموقع (shoroogmi.com).'
    en: '**Media articles, artificial-intelligence articles and cultural topics:** you may share and copy them in full, provided you credit the writer (Shoroog Almehmadi) or mention the website (shoroogmi.com).'
- title_ar: ما ليس ملكًا للكاتبة
  title_en: Content owned by others
  paragraphs:
  - ar: حقوق أغلفة الكتب والأعمال المقتبس منها محفوظة لأصحابها، وتُعرض للتعريف فقط. والترجمات الإنجليزية لمعاني الآيات مأخوذة من ترجمة Saheeh International (المنشورة على Quran.com)، وترجمات الأحاديث من الترجمات المنشورة على Sunnah.com.
    en: Book covers and quoted works belong to their owners and are shown for reference only. The English renderings of Quranic verses are from the Saheeh International translation (as published on Quran.com), and hadith translations are those published on Sunnah.com.
- title_ar: التعليقات والرسائل
  title_en: Comments and messages
  paragraphs:
  - ar: أنت مسؤول عمّا تكتبه. يُمنع نشر الإساءة أو الشتم أو التحريض أو الإعلانات أو ما يخالف الأنظمة. وللكاتبة حذف أي تعليق دون إشعار.
    en: You are responsible for what you write. Abuse, insults, incitement, advertising and anything unlawful are not allowed, and the writer may remove any comment without notice.
- title_ar: التسجيلات الصوتية والترجمة
  title_en: Audio and translation
  paragraphs:
  - ar: التسجيلات الصوتية بصوت آلي مولَّد، وقد يقع فيها خطأ في النطق، والمرجع هو النص المكتوب. والنص العربي هو الأصل إذا اختلف عن الترجمة الإنجليزية.
    en: The audio recordings use a computer-generated voice and may mispronounce a word; the written text is the reference. Where the English translation differs from the Arabic, the Arabic original prevails.
- title_ar: إخلاء المسؤولية
  title_en: Disclaimer
  paragraphs:
  - ar: محتوى الموقع تأملات وآراء شخصية للكاتبة، ولا يُعدّ فتوى شرعية، ولا استشارة نفسية أو طبية أو قانونية متخصصة.
    en: The content of this site is the writer's personal reflection and opinion. It is not a religious ruling (fatwa), nor specialist psychological, medical or legal advice.
- title_ar: الروابط الخارجية
  title_en: External links
  paragraphs:
  - ar: قد يحتوي الموقع على روابط لمواقع أخرى، ولا تتحمل الكاتبة مسؤولية محتواها أو سياساتها.
    en: The site may link to other websites; the writer is not responsible for their content or policies.
- title_ar: تعديل الشروط
  title_en: Changes to these terms
  paragraphs:
  - ar: 'قد تُعدَّل هذه الشروط من حين لآخر، ويظهر تاريخ آخر تحديث في أعلى الصفحة. للتواصل: [shoroogmi1@gmail.com](mailto:shoroogmi1@gmail.com).'
    en: 'These terms may change from time to time; the date of the latest update appears at the top of the page. Contact: [shoroogmi1@gmail.com](mailto:shoroogmi1@gmail.com).'
